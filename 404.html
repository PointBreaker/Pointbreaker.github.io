<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>页面已迁移 — CourseStack 课栈</title>
  <style>
    :root { color-scheme: light; --bg:#f2f1eb; --paper:#fffef9; --ink:#171b18; --muted:#626a63; --line:#d9ddd8; --accent:#166534; }
    * { box-sizing:border-box; }
    body { min-width:320px; min-height:100vh; display:grid; place-items:center; margin:0; padding:24px; background:var(--bg); color:var(--ink); font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(620px,100%); padding:clamp(28px,6vw,56px); border:1px solid var(--line); border-radius:18px; background:var(--paper); box-shadow:0 20px 60px rgba(31,39,32,.08); }
    p { color:var(--muted); line-height:1.75; }
    .eyebrow { color:var(--accent); font:700 .72rem/1.2 ui-monospace,SFMono-Regular,Consolas,monospace; letter-spacing:.12em; text-transform:uppercase; }
    h1 { margin:.7rem 0 1rem; font-family:ui-serif,Georgia,Cambria,"Times New Roman",serif; font-size:clamp(2.5rem,9vw,4.8rem); line-height:.98; letter-spacing:-.055em; }
    a { color:var(--accent); text-underline-offset:.2em; }
  </style>
  <script>
    (() => {
      const legacyCourses = new Set(['cs336', 'cs267', '6.1810', 'cs152']);
      const relative = location.pathname.replace(/^\/+/, '');
      const firstSegment = relative.split('/')[0];
      if (legacyCourses.has(firstSegment)) {
        location.replace(`/courses/${relative}${location.search}${location.hash}`);
      }
    })();
  </script>
</head>
<body>
  <main>
    <p class="eyebrow">404 · CourseStack</p>
    <h1>这一页暂时找不到。</h1>
    <p>课程内容已经统一迁移到 <code>/courses/</code>。旧课程链接会自动跳转；其他页面可以从课程主页重新进入。</p>
    <p><a href="/">返回 CourseStack 课程主页</a></p>
  </main>
</body>
</html>
