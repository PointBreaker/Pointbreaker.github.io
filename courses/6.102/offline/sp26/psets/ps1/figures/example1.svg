<svg xmlns="http://www.w3.org/2000/svg" viewBox="9 4 92 68" style="fill:none; transform: scaleY(-1);">
<style>
text { fill: red; dominant-baseline: middle; text-anchor: middle; opacity: 0.75; cursor: pointer; }
svg.playing .playbutton,
svg:not(.playing) .pausebutton,
svg.playing:not(:hover) .pausebutton { display: none; }
</style>
<script>
const svg = document.rootElement;
svg.pauseAnimations();
svg.addEventListener('click', function() {
    if (svg.animationsPaused()) {
        svg.unpauseAnimations();
        svg.classList.add('playing');
    } else {
        svg.pauseAnimations();
        svg.classList.remove('playing');
    }
});
</script>
<text x="55" y="38" class="playbutton" font-size="8.2">▶️</text>
<text x="55" y="38" class="pausebutton" font-size="8.2">⏸️</text>
