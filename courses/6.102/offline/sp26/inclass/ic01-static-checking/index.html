<html>
<body></body>
<script>
document.head.appendChild(document.createElement('style')).append(`
@import url(https://fonts.googleapis.com/css?family=Open+Sans:400,700);
@import url(https://fonts.googleapis.com/css?family=Inconsolata:400,700);
body { font-family: 'Open Sans', sans-serif; margin: 5%; }
h1, h2, h3 { white-space: nowrap; }
code { font-family: Inconsolata, monospace; font-size: 110%; }
h2 code { letter-spacing: -1; }
`);
const proj = document.location.toString().match(/([^/]+)[/]?$/)[1]; // document.title; //getElementsByTagName('h1')[0].textContent;
document.title = proj;
const url = document.location.toString().replace(/[/]?$/, '/.git');
//const cmd = document.getElementsByTagName('code')[0].textContent;
const instructions = new DOMParser().parseFromString(`
<h1>${proj}</h1>
<p>To start working on this exercise with a partner, both partners visit this page and follow these instructions.</p>
<ol><li>On the command line,<code> <b>cd</b> </code>to the directory where you keep 6.102 code</li>
    <li>Then run <h2 id="selected"><code>git clone ${url}</code></h2>
    <li><code><b>cd</b> ${proj} </code>
    <li><code> <b>npm install</b></code>
    <li><code> <b>code .</b> </code> (in VS Code, open the<code> ${proj} </code>folder)
        <ul>
        <li><small>do not open a parent folder that contains the ${proj} folder; that won't work</small> 
        <li><small>if VS Code asks if you trust the ${proj} folder, say Yes (and click the checkbox to trust the parent folder too)</small>
        </ul>
    <li>Click <b>Collaborate</b> on the status bar (bottom of the VS Code window)
        <ul>
        <li><small>if VS Code asks if you trust the external website, click Manage Trusted Domains and trust constellation.mit.edu</small>
        <!--<li><small>if you get a 404 error, you didn't open the ${proj} folder in VS Code, go back to the previous step</small>-->
        </ul>
    <li>Enter your partner's joincode
  </ol>
<p>You cannot push to this repo. Your in-class participation is recorded by Constellation.</p>
`, 'text/html');
document.body.replaceChildren(...instructions.body.children);

// select the URL for easy copying
const selection = window.getSelection();
const range = document.createRange();
const elt = document.getElementById('selected');
range.selectNodeContents(elt);
selection.removeAllRanges();
selection.addRange(range);
</script>
