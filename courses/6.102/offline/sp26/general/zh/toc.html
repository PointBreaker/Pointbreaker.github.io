<main class="widepage container-fluid" data-structure-remote="https://handx.mit.edu/v1/6.102/sp26/structure"><h1 class="handout-title col-sm-10 col-sm-offset-1" id="topics_and_terms"><a class="jump" href="toc.html#topics_and_terms"></a>主题与术语</h1><div data-outline="topics_and_terms">

<div class="markdown col-sm-10 col-sm-offset-1 converted">

<div class="row"><div class="col-sm-6"><ul id="toc"><li class="loading"><p>正在加载目录…</p></li></ul></div>
<div class="col-sm-6" style="columns: 2"><ul id="index"><li class="loading"><p>正在加载索引…</p></li></ul></div></div>

</div>

<style>
/* TOC styles */
ul { padding-left: 0; }
ul li { list-style-type: none; margin-bottom: 1px; margin-left: 20px; text-indent: -20px; }
ul li a { color: #769; }
ul li a:hover { color: #659; }
ul ul { padding-left: 20px; margin-bottom: 5px; font-size: smaller; }
li .ex { display: none; top: 0; padding-left: 5px; color: #769; font-size: 95%; }
li                 .ex:last-of-type { opacity: .2; display: inline; }
li             .ex+.ex:last-of-type { opacity: .4; }
li         .ex+.ex+.ex:last-of-type { opacity: .6; }
li     .ex+.ex+.ex+.ex:last-of-type { opacity: .8; }
li .ex+.ex+.ex+.ex+.ex:last-of-type { opacity: 1; }
</style>

<script>
/* TOC script */
window.onHandoutDidRender = function() {
  $('main').attr('data-structure-remote', HANDOUT_HANDX + 'structure');
};
window.onHandoutReady = function() {
  if (window.HANDOUT_PREVIEW) {
    $('.loading:first').append('Paste sample structure JSON in toc-preview-data.js');
    var script = document.createElement('script');
    script.src = 'toc-preview-data.js';
    script.onload = function() {
      display(HANDOUT_PREVIEW_STRUCTURE);
    };
    document.querySelector('body').appendChild(script);
  } else {
    $.ajax($('main').data('structure-remote')).done(function(data, status, xhr) {
      display(xhr.responseJSON);
    });
  }
};

var terms = [];

var builders = {
  h1: function(config, elt) {
    $('#toc').append($('<li>').append(link(elt.text, config.handout)));
  },
  h2: function(config, elt) {
    if ( ! $('#toc > :last-child').is('ul')) {
      $('#toc').append($('<ul>'));
    }
    $('#toc > :last-child').append($('<li>').append(link(elt.text, config.handout, elt.id)));
  },
  exercise: function(config, elt) {
    $('#toc li:last').append($('<span>').addClass('ex glyphicon glyphicon-pencil'));
  },
  mark: function(config, elt) {
    terms.push({ text: elt.text, handout: config.handout, id: elt.id });
  },
};

function link(text, handout, id) {
  return $('<a>').attr('href', '../' + handout + '/' + (id ? '#' + id : '')).text(text);
}

function display(configs) {
  $('#toc .loading').remove();

  configs.filter(function(config) { return config.structure; }).forEach(function(config) {
    config.structure.forEach(function(elt) {
      if (builders[elt.item]) { builders[elt.item](config, elt); }
    });
  });

  terms.sort(function(a, b) {
    if (a.text == b.text) { return a.handout.localeCompare(b.handout); }
    return a.text.localeCompare(b.text);
  });

  $('#index .loading').remove();

  terms.forEach(function(elt) {
    if ($('#index li:last a:first').text() == elt.text) {
      $('#index li:last').append(', ')
                         .append(link('×'+($('#index li:last a').length+1), elt.handout, elt.id));
    } else {
      $('#index').append($('<li>').append(link(elt.text, elt.handout, elt.id)));
    }
  });
}
</script>

</div></main>
