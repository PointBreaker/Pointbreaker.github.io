<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" role="img" aria-labelledby="t d"><title id="t">BFS 与 DFS 静态对比</title><desc id="d">同一张图上的 BFS 分层顺序和 DFS 深入顺序。</desc><rect width="880" height="390" rx="24" fill="#f7faf7"/><text x="44" y="48" font-family="sans-serif" font-size="22" font-weight="700" fill="#173b2b">同一张图，两种不变量</text>
  <g transform="translate(70 78)" font-family="sans-serif"><text x="150" y="0" text-anchor="middle" font-size="18" font-weight="700" fill="#2d6a4f">BFS · 按距离分层</text><g stroke="#87a998" stroke-width="3"><path d="M150 45L75 120M150 45L225 120M75 120L35 215M75 120L115 215M225 120L265 215M115 215L265 215"/></g><g fill="#fff" stroke="#2d6a4f" stroke-width="3"><circle cx="150" cy="45" r="23"/><circle cx="75" cy="120" r="23"/><circle cx="225" cy="120" r="23"/><circle cx="35" cy="215" r="23"/><circle cx="115" cy="215" r="23"/><circle cx="265" cy="215" r="23"/></g><g text-anchor="middle" font-size="16" fill="#173b2b"><text x="150" y="51">A</text><text x="75" y="126">B</text><text x="225" y="126">C</text><text x="35" y="221">D</text><text x="115" y="221">E</text><text x="265" y="221">F</text></g><text x="150" y="275" text-anchor="middle" fill="#355b49">A → B,C → D,E,F</text></g>
  <g transform="translate(500 78)" font-family="sans-serif"><text x="150" y="0" text-anchor="middle" font-size="18" font-weight="700" fill="#a45b2a">DFS · 沿分支深入</text><path d="M150 45L75 105L45 170L115 225L225 170L255 105" fill="none" stroke="#c8793c" stroke-width="5" stroke-linecap="round"/><g fill="#fff" stroke="#a45b2a" stroke-width="3"><circle cx="150" cy="45" r="23"/><circle cx="75" cy="105" r="23"/><circle cx="45" cy="170" r="23"/><circle cx="115" cy="225" r="23"/><circle cx="225" cy="170" r="23"/><circle cx="255" cy="105" r="23"/></g><g text-anchor="middle" font-size="16" fill="#563017"><text x="150" y="51">A</text><text x="75" y="111">B</text><text x="45" y="176">D</text><text x="115" y="231">E</text><text x="225" y="176">F</text><text x="255" y="111">C</text></g><text x="150" y="275" text-anchor="middle" fill="#6b452b">A → B → D → E → F → C</text></g>
</svg>
