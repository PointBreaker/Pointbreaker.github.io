<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" role="img" aria-labelledby="t d">
  <title id="t">递推树静态图</title><desc id="d">T(n)=2T(n/2)+n 的前三层，每层总代价都是 n，树高为 log2 n。</desc>
  <rect width="880" height="390" rx="24" fill="#f7faf7"/><text x="44" y="48" font-family="sans-serif" font-size="22" font-weight="700" fill="#173b2b">T(n)=2T(n/2)+n</text>
  <g stroke="#8ab39c" stroke-width="2"><path d="M440 88L270 148M440 88L610 148M270 188L175 248M270 188L365 248M610 188L515 248M610 188L705 248"/></g>
  <g font-family="sans-serif" text-anchor="middle"><g fill="#2d6a4f"><rect x="375" y="66" width="130" height="44" rx="12"/><rect x="205" y="146" width="130" height="44" rx="12"/><rect x="545" y="146" width="130" height="44" rx="12"/></g><g fill="#fff" font-size="16"><text x="440" y="94">n · 工作 n</text><text x="270" y="174">n/2 · 工作 n/2</text><text x="610" y="174">n/2 · 工作 n/2</text></g>
  <g fill="#dceee3" stroke="#2d6a4f"><rect x="120" y="246" width="110" height="40" rx="10"/><rect x="310" y="246" width="110" height="40" rx="10"/><rect x="460" y="246" width="110" height="40" rx="10"/><rect x="650" y="246" width="110" height="40" rx="10"/></g><g fill="#173b2b" font-size="15"><text x="175" y="271">n/4</text><text x="365" y="271">n/4</text><text x="515" y="271">n/4</text><text x="705" y="271">n/4</text></g></g>
  <g font-family="sans-serif" font-size="17" fill="#355b49"><text x="55" y="94">第 0 层：n</text><text x="55" y="174">第 1 层：2·n/2=n</text><text x="55" y="271">第 2 层：4·n/4=n</text><text x="240" y="342" font-size="20" font-weight="700">每层 Θ(n) × Θ(log n) 层 = Θ(n log n)</text></g>
</svg>
