<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" role="img" aria-labelledby="t d"><title id="t">最大流残量网络</title><desc id="d">从 s 经 A、B 到 t 的流网络，标注流量与容量。</desc><rect width="880" height="390" rx="24" fill="#f7faf7"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2d6a4f"/></marker></defs><text x="44" y="48" font-family="sans-serif" font-size="22" font-weight="700" fill="#173b2b">残量网络允许“继续送”也允许“撤回重选”</text>
  <g stroke="#2d6a4f" stroke-width="5" fill="none" marker-end="url(#a)"><path d="M145 185L305 110"/><path d="M145 215L305 285"/><path d="M365 110L555 185"/><path d="M365 285L555 215"/><path d="M345 145L345 250"/></g><g font-family="sans-serif" font-size="17" font-weight="700" fill="#355b49"><text x="215" y="123">3/3</text><text x="215" y="286">2/2</text><text x="463" y="126">2/2</text><text x="465" y="291">3/3</text><text x="365" y="205">1/1</text></g><g font-family="sans-serif" text-anchor="middle" font-size="20" font-weight="700"><g fill="#fff" stroke="#2d6a4f" stroke-width="4"><circle cx="110" cy="200" r="37"/><circle cx="340" cy="95" r="37"/><circle cx="340" cy="300" r="37"/><circle cx="590" cy="200" r="37"/></g><g fill="#173b2b"><text x="110" y="207">s</text><text x="340" y="102">A</text><text x="340" y="307">B</text><text x="590" y="207">t</text></g></g><g font-family="sans-serif"><rect x="670" y="112" width="165" height="175" rx="18" fill="#e5f1e9"/><text x="695" y="151" font-size="17" font-weight="700" fill="#173b2b">最大流 = 5</text><text x="695" y="188" font-size="15" fill="#355b49">标注：流 / 容量</text><text x="695" y="223" font-size="15" fill="#355b49">源点出边割容量</text><text x="695" y="251" font-size="18" font-weight="700" fill="#2d6a4f">3 + 2 = 5</text></g>
