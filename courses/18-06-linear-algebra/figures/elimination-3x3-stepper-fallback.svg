<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img" aria-label="3x3 高斯消元得到上三角 U 与下三角 L 的静态图示">
  <rect width="480" height="240" fill="#fff"/>
  <text x="240" y="30" text-anchor="middle" font-family="serif" font-size="16" fill="#111">3x3 高斯消元：A = LU</text>
  <text x="60" y="80" font-family="serif" font-size="14" fill="#444">A 上三角化</text>
  <text x="60" y="110" font-family="serif" font-size="20" fill="#c8102e">[ 2  1  0 ]</text>
  <text x="60" y="135" font-family="serif" font-size="20" fill="#c8102e">[ 0  3  1 ]  = U</text>
  <text x="60" y="160" font-family="serif" font-size="20" fill="#c8102e">[ 0  0  4 ]</text>
  <text x="250" y="80" font-family="serif" font-size="14" fill="#444">乘子构成 L</text>
  <text x="250" y="110" font-family="serif" font-size="20" fill="#166534">[ 1  0  0 ]</text>
  <text x="250" y="135" font-family="serif" font-size="20" fill="#166534">[ 2  1  0 ]</text>
  <text x="250" y="160" font-family="serif" font-size="20" fill="#166534">[ 1  0  1 ]</text>
  <text x="200" y="200" font-family="sans-serif" font-size="12" fill="#666">乘子 ℓ₂₁=2, ℓ₃₁=1 记录行变换的倍数</text>
</svg>
