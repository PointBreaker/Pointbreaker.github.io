<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img" aria-label="四个基本子空间：列空间、零空间、行空间、左零空间及其维数关系">
  <rect width="480" height="280" fill="#fff"/>
  <text x="240" y="28" text-anchor="middle" font-family="serif" font-size="16" fill="#111">四个基本子空间 (m×n 矩阵，秩 r)</text>
  <rect x="20" y="50" width="200" height="90" fill="#eef5ee" stroke="#166534"/>
  <text x="120" y="75" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#166534">ℝⁿ 中</text>
  <text x="70" y="105" font-family="serif" font-size="14" fill="#111">行空间 C(Aᵀ)   dim = r</text>
  <text x="70" y="128" font-family="serif" font-size="14" fill="#111">零空间 N(A)     dim = n−r</text>
  <rect x="260" y="50" width="200" height="90" fill="#fdecec" stroke="#c8102e"/>
  <text x="360" y="75" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#c8102e">ℝᵐ 中</text>
  <text x="310" y="105" font-family="serif" font-size="14" fill="#111">列空间 C(A)     dim = r</text>
  <text x="310" y="128" font-family="serif" font-size="14" fill="#111">左零空间 N(Aᵀ)  dim = m−r</text>
  <text x="240" y="180" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#444">行空间 ⟂ 零空间 (在 ℝⁿ 中正交补)</text>
  <text x="240" y="205" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#444">列空间 ⟂ 左零空间 (在 ℝᵐ 中正交补)</text>
  <text x="240" y="245" text-anchor="middle" font-family="serif" font-size="14" fill="#111">核心恒等式：r + (n−r) = n ,  r + (m−r) = m</text>
</svg>
