<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="SVD 秩-k 逼近的静态对比图示，展示 k=1,2,4 的重建效果">
  <rect width="480" height="300" fill="#fff"/>
  <text x="240" y="28" text-anchor="middle" font-family="serif" font-size="16" fill="#111">SVD 秩-k 逼近效果对比</text>
  <g transform="translate(40,60)">
    <text x="32" y="-5" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444">k=1</text>
    <rect x="0" y="0" width="64" height="64" fill="#c8102e"/>
    <rect x="32" y="0" width="32" height="32" fill="#fee2e2"/>
    <rect x="0" y="32" width="32" height="32" fill="#fee2e2"/>
  </g>
  <g transform="translate(190,60)">
    <text x="32" y="-5" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444">k=2</text>
    <rect x="0" y="0" width="64" height="64" fill="#c8102e" opacity="0.85"/>
    <rect x="16" y="16" width="32" height="32" fill="#c8102e" opacity="0.4"/>
    <rect x="40" y="40" width="24" height="24" fill="#fee2e2"/>
  </g>
  <g transform="translate(340,60)">
    <text x="32" y="-5" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444">k=4</text>
    <rect x="0" y="0" width="64" height="64" fill="url(#grad)"/>
    <defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c8102e"/><stop offset="1" stop-color="#fee2e2"/></linearGradient></defs>
  </g>
  <text x="240" y="180" text-anchor="middle" font-family="serif" font-size="14" fill="#111">A ≈ U(:,1:k) Σ(1:k,1:k) V(:,1:k)ᵀ</text>
  <text x="240" y="210" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666">奇异值衰减很快时，很小的 k 就能保留矩阵大部分信息</text>
  <text x="240" y="240" text-anchor="middle" font-family="serif" font-size="13" fill="#111">σ₁ ≥ σ₂ ≥ σ₃ ≥ ... ≥ 0</text>
  <text x="72" y="275" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">粗糙</text>
  <text x="222" y="275" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">较好</text>
  <text x="372" y="275" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">精细</text>
</svg>
