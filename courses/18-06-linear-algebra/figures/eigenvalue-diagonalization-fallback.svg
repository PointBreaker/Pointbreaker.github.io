<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="单位圆在矩阵作用下映成椭圆，半轴为特征值的静态图示">
  <rect width="480" height="300" fill="#fff"/>
  <text x="240" y="28" text-anchor="middle" font-family="serif" font-size="16" fill="#111">特征值的几何意义：沿特征方向的伸缩</text>
  <g transform="translate(240,160)">
    <ellipse cx="0" cy="0" rx="30" ry="30" fill="none" stroke="#94a3b8" stroke-dasharray="3,3"/>
    <polygon points="0,-100 18,0 0,100 -18,0" fill="#fdecec" stroke="#c8102e"/>
    <line x1="-150" y1="0" x2="150" y2="0" stroke="#166534" stroke-width="2"/>
    <line x1="0" y1="-130" x2="0" y2="130" stroke="#166534" stroke-width="2"/>
    <text x="105" y="-5" font-family="serif" font-size="14" fill="#166534">λ₁ v₁</text>
    <text x="5" y="-55" font-family="serif" font-size="14" fill="#166534">λ₂ v₂</text>
    <circle cx="0" cy="0" r="3" fill="#111"/>
  </g>
  <text x="240" y="285" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666">单位圆（虚线）被 A 映成椭圆，半轴长 = |λᵢ|，方向 = 特征向量 vᵢ</text>
</svg>
