<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">DNS 递归解析：谁问谁、谁缓存</title><desc id="desc">从浏览器缓存未命中开始，逐步区分 stub resolver、递归解析器与权威服务器。</desc><rect width="960" height="420" rx="24" fill="#fbfdfd"/><text x="54" y="56" fill="#0b4442" font-family="system-ui,sans-serif" font-size="27" font-weight="750">DNS 递归解析：谁问谁、谁缓存</text><text x="54" y="88" fill="#426160" font-family="system-ui,sans-serif" font-size="15">交互组件加载前的静态路径概览</text><g font-family="system-ui,sans-serif"><g transform="translate(54 132)"><rect width="390" height="94" rx="16" fill="#dff4f1" stroke="#87aaa7"/><circle cx="34" cy="30" r="18" fill="#0b7285"/><text x="34" y="36" text-anchor="middle" fill="white" font-size="16" font-weight="700">1</text><text x="64" y="36" fill="#163737" font-size="18" font-weight="650">本地检查</text><path d="M64 57 H350" stroke="#b8cecc"/></g><g transform="translate(484 132)"><rect width="390" height="94" rx="16" fill="#f4f7f8" stroke="#87aaa7"/><circle cx="34" cy="30" r="18" fill="#0b7285"/><text x="34" y="36" text-anchor="middle" fill="white" font-size="16" font-weight="700">2</text><text x="64" y="36" fill="#163737" font-size="18" font-weight="650">交给递归解析器</text><path d="M64 57 H350" stroke="#b8cecc"/></g><g transform="translate(54 260)"><rect width="390" height="94" rx="16" fill="#f4f7f8" stroke="#87aaa7"/><circle cx="34" cy="30" r="18" fill="#0b7285"/><text x="34" y="36" text-anchor="middle" fill="white" font-size="16" font-weight="700">3</text><text x="64" y="36" fill="#163737" font-size="18" font-weight="650">沿委派链迭代</text><path d="M64 57 H350" stroke="#b8cecc"/></g><g transform="translate(484 260)"><rect width="390" height="94" rx="16" fill="#f4f7f8" stroke="#87aaa7"/><circle cx="34" cy="30" r="18" fill="#0b7285"/><text x="34" y="36" text-anchor="middle" fill="white" font-size="16" font-weight="700">4</text><text x="64" y="36" fill="#163737" font-size="18" font-weight="650">权威回答与缓存</tex