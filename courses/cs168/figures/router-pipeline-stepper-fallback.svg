<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">Router pipeline：10.1.2.99 的一次转发</title><desc id="desc">用具体 FIB 与 TTL=2 的数据报跟踪验证、递减、LPM、邻居状态、排队和输出。</desc><rect width="960" height="420" rx="24" fill="#fbfdfd"/><text x="54" y="56" fill="#0b4442" font-family="system-ui,sans-serif" font-size="27" font-weight="750">Router pipeline：10.1.2.99 的一次转发</text><text x="54" y="88" fill="#426160" font-family="system-ui,sans-serif" font-size="15">交互组件加载前的静态路径概览</text><g font-family="system-ui,sans-serif"><g transform="translate(54 132)"><rect width="390" height="94" rx="16" fill="#dff4f1" stroke="#87aaa7"/><circle cx="34" cy="30" r="18" fill="#0b7285"/><text x="34" y="36" text-anchor="middle" fill="white" font-size="16" font-weight="700">1</text><text x="64" y="36" fill="#163737" font-size="18" font-weight="650">Ingress validation</text><path d="M64 57 H350" stroke="#b8cecc"/></g><g transform="translate(484 132)"><rect width="390" height="94" rx="16" fill="#f4f7f8" stroke="#87aaa7"/><circle cx="34" cy="30" r="18" fill="#0b7285"/><text x="34" y="36" text-anchor="middle" fill="white" font-size="16" font-weight="700">2</text><text x="64" y="36" fill="#163737" font-size="18" font-weight="650">TTL 2→1</text><path d="M64 57 H350" stroke="#b8cecc"/></g><g transform="translate(54 260)"><rect width="390" height="94" rx="16" fill="#f4f7f8" stroke="#87aaa7"/><circle cx="34" cy="30" r="18" fill="#0b7285"/><text x="34" y="36" text-anchor="middle" fill="white" font-size="16" font-weight="700">3</text><text x="64" y="36" fill="#163737" font-size="18" font-weight="650">LPM：四项都检查</text><path d="M64 57 H350" stroke="#b8cecc"/></g><g transform="translate(484 260)"><rect width="390" height="94" rx="16" fill="#f4f7f8" stroke="#87aaa7"/><circle cx="34" cy="30" r="18" fill="#0b7285"/><text x="34" y="36" text-anchor="middle" fill="white" font-size="16" font-weight="700">4</text><text x="64" y="36" fill="#163737" font-size="18" font-weight="650">Select next hop</text><path d="M64 57 H350" stroke="#b8cecc"/></g></g><text x="54" y="397" fill="#426160" font-family="system-ui,sans-serif" font-size="14">打开交互版本可逐步切换状态或调节参数。</text></svg>