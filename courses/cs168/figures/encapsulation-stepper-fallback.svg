<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">一个 HTTP 字节如何被逐层封装</title><desc id="desc">逐层查看主机与网络分别添加什么控制信息，以及中间设备真正读取哪一层。</desc><rect width="960" height="420" rx="24" fill="#fbfdfd"/><text x="54" y="56" fill="#0b4442" font-family="system-ui,sans-serif" font-size="27" font-weight="750">一个 HTTP 字节如何被逐层封装</text><text x="54" y="88" fill="#426160" font-family="system-ui,sans-serif" font-size="15">交互组件加载前的静态路径概览</text><g font-family="system-ui,sans-serif"><g transform="translate(54 132)"><rect width="390" height="94" rx="16" fill="#dff4f1" stroke="#87aaa7"/><circle cx="34" cy="30" r="18" fill="#0b7285"/><text x="34" y="36" text-anchor="middle" fill="white" font-size="16" font-weight="700">1</text><text x="64" y="36" fill="#163737" font-size="18" font-weight="650">应用层：生成消息</text><path d="M64 57 H350" stroke="#b8cecc"/></g><g transform="translate(484 132)"><rect width="390" height="94" rx="16" fill="#f4f7f8" stroke="#87aaa7"/><circle cx="34" cy="30" r="18" fill="#0b7285"/><text x="34" y="36" text-anchor="middle" fill="white" font-size="16" font-weight="700">2</text><text x="64" y="36" fill="#163737" font-size="18" font-weight="650">传输层：端到端会话</text><path d="M64 57 H350" stroke="#b8cecc"/></g><g transform="translate(54 260)"><rect width="390" height="94" rx="16" fill="#f4f7f8" stroke="#87aaa7"/><circle cx="34" cy="30" r="18" fill="#0b7285"/><text x="34" y="36" text-anchor="middle" fill="white" font-size="16" font-weight="700">3</text><text x="64" y="36" fill="#163737" font-size="18" font-weight="650">网络层：跨网络寻址</text><path d="M64 57 H350" stroke="#b8cecc"/></g><g transform="translate(484 260)"><rect width="390" height="94" rx="16" fill="#f4f7f8" stroke="#87aaa7"/><circle cx="34" cy="30" r="18" fill="#0b7285"/><text x="34" y="36" text-anchor="middle" fill="white" font-size="16" font-weight="700">4</text><text x="64" y="36" fill="#163737" font-size="18" font-weight="650">链路层：走过一跳</text><path d="M64 57 H350" stroke="#b8cecc"/></g></g><text x="54" y="397" fill="#426160" font-family="system-ui,sans-serif" font-size="14">打开交互版本可逐步切换状态或调节参数。</text></svg>