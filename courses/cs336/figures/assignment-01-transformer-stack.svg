<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 540" role="img" aria-labelledby="title desc">
  <title id="title">Assignment 1 Transformer 语言模型数据流</title>
  <desc id="desc">文本经过字节级 BPE 得到 token id，经 embedding、RoPE、多层 pre-norm Transformer block、最终 RMSNorm 和语言模型头得到 logits；交叉熵产生梯度并由 AdamW 更新参数。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#47715a"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f3026" flood-opacity="0.12"/>
    </filter>
    <style>
      .box{fill:#fff;stroke:#b9c9bd;stroke-width:2;rx:16;filter:url(#shadow)}
      .core{fill:#eef8f0;stroke:#4d8b61;stroke-width:2.4;rx:18;filter:url(#shadow)}
      .inner{fill:#fff;stroke:#b9c9bd;stroke-width:1.6;rx:12}
      .label{font:700 19px ui-sans-serif,system-ui,sans-serif;fill:#183224}
      .small{font:500 14px ui-sans-serif,system-ui,sans-serif;fill:#52675a}
      .tiny{font:650 13px ui-monospace,SFMono-Regular,monospace;fill:#326044}
      .arrow{stroke:#47715a;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
      .residual{stroke:#9a6f24;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1180" height="540" fill="#f7faf7" rx="24"/>

  <rect class="box" x="34" y="72" width="142" height="92"/>
  <text class="label" x="105" y="109" text-anchor="middle">原始文本</text>
  <text class="small" x="105" y="137" text-anchor="middle">Unicode 字符串</text>

  <path class="arrow" d="M176 118 H220"/>
  <rect class="box" x="222" y="72" width="160" height="92"/>
  <text class="label" x="302" y="105" text-anchor="middle">Byte BPE</text>
  <text class="small" x="302" y="132" text-anchor="middle">UTF-8 bytes</text>
  <text class="small" x="302" y="151" text-anchor="middle">merge → token IDs</text>

  <path class="arrow" d="M382 118 H426"/>
  <rect class="box" x="428" y="72" width="160" height="92"/>
  <text class="label" x="508" y="105" text-anchor="middle">Embedding</text>
  <text class="tiny" x="508" y="135" text-anchor="middle">[B,T] → [B,T,D]</text>

  <path class="arrow" d="M588 118 H632"/>
  <rect class="core" x="634" y="34" width="316" height="316"/>
  <text class="label" x="792" y="68" text-anchor="middle">N × Pre-Norm Transformer Block</text>

  <rect class="inner" x="668" y="91" width="248" height="58"/>
  <text class="label" x="792" y="116" text-anchor="middle">RMSNorm → Q/K/V</text>
  <text class="small" x="792" y="138" text-anchor="middle">RoPE 作用在每个 attention head</text>

  <path class="arrow" d="M792 149 V174"/>
  <rect class="inner" x="668" y="176" width="248" height="58"/>
  <text class="label" x="792" y="201" text-anchor="middle">Causal Multi-Head Attention</text>
  <text class="tiny" x="792" y="223" text-anchor="middle">softmax(QKᵀ/√dₕ + mask)V</text>

  <path class="arrow" d="M792 234 V259"/>
  <rect class="inner" x="668" y="261" width="248" height="58"/>
  <text class="label" x="792" y="286" text-anchor="middle">RMSNorm → SwiGLU</text>
  <text class="small" x="792" y="307" text-anchor="middle">逐位置前馈网络</text>

  <path class="residual" d="M650 119 C620 119 620 205 658 205"/>
  <path class="residual" d="M650 205 C620 205 620 290 658 290"/>
  <text class="tiny" x="644" y="335" text-anchor="start">虚线：residual path</text>

  <path class="arrow" d="M950 118 H994"/>
  <rect class="box" x="996" y="72" width="150" height="92"/>
  <text class="label" x="1071" y="103" text-anchor="middle">RMSNorm</text>
  <text class="label" x="1071" y="130" text-anchor="middle">+ LM Head</text>
  <text class="tiny" x="1071" y="151" text-anchor="middle">[B,T,V]</text>

  <path class="arrow" d="M1071 164 V215"/>
  <rect class="box" x="996" y="217" width="150" height="82"/>
  <text class="label" x="1071" y="248" text-anchor="middle">Logits</text>
  <text class="small" x="1071" y="274" text-anchor="middle">next-token scores</text>

  <path class="arrow" d="M1071 299 V365 H874"/>
  <rect class="box" x="690" y="366" width="184" height="92"/>
  <text class="label" x="782" y="399" text-anchor="middle">Cross-Entropy</text>
  <text class="small" x="782" y="426" text-anchor="middle">稳定 log-sum-exp</text>
  <text class="small" x="782" y="447" text-anchor="middle">得到 loss 与 gradients</text>

  <path class="arrow" d="M690 412 H520"/>
  <rect class="box" x="320" y="366" width="200" height="92"/>
  <text class="label" x="420" y="399" text-anchor="middle">AdamW + Schedule</text>
  <text class="small" x="420" y="426" text-anchor="middle">warmup / cosine / clipping</text>
  <text class="small" x="420" y="447" text-anchor="middle">更新模型参数</text>

  <path class="arrow" d="M320 412 H176"/>
  <rect class="box" x="34" y="366" width="142" height="92"/>
  <text class="label" x="105" y="399" text-anchor="middle">训练系统</text>
  <text class="small" x="105" y="426" text-anchor="middle">batch / checkpoint</text>
  <text class="small" x="105" y="447" text-anchor="middle">generate / evaluate</text>

  <path class="residual" d="M420 366 C420 330 536 334 634 319"/>
  <text class="small" x="42" y="508">概念重绘：依据 CS336 Assignment 1 的 tokenizer、Transformer、loss、optimizer 与 training-loop 任务关系整理。</text>
</svg>
