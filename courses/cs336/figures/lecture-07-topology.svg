<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">GPU 节点内与节点间通信的概念拓扑</title>
  <desc id="desc">GPU compute 连接本地 HBM，并分别通过 NVLink 或 NVSwitch 到达节点内 peer GPU，通过 PCIe、HCA 或 NIC 和 InfiniBand 或 RoCE 到达其他节点。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#166534"/>
    </marker>
    <style>
      .box{fill:#fffdf8;stroke:#9ca79d;stroke-width:2;rx:14}
      .core{fill:#dcfce7;stroke:#166534;stroke-width:2;rx:14}
      .label{font:600 20px system-ui,sans-serif;fill:#20231f;text-anchor:middle}
      .sub{font:15px system-ui,sans-serif;fill:#62675f;text-anchor:middle}
      .flow{fill:none;stroke:#166534;stroke-width:3;marker-end:url(#arrow)}
      .group{fill:none;stroke:#b8beb8;stroke-width:2;stroke-dasharray:8 8;rx:18}
      .group-label{font:700 16px system-ui,sans-serif;fill:#14532d}
    </style>
  </defs>

  <rect class="group" x="30" y="34" width="840" height="362"/>
  <text class="group-label" x="52" y="64">conceptual model · 真实机器的 switch、rail 与 NUMA 连接可能更复杂</text>

  <rect class="core" x="70" y="158" width="150" height="76"/>
  <text class="label" x="145" y="188">GPU compute</text>
  <text class="sub" x="145" y="215">SM / tensor core</text>

  <rect class="core" x="278" y="158" width="126" height="76"/>
  <text class="label" x="341" y="188">HBM</text>
  <text class="sub" x="341" y="215">local memory</text>
  <path class="flow" d="M220 196 H270"/>

  <rect class="box" x="510" y="92" width="180" height="76"/>
  <text class="label" x="600" y="122">NVLink / NVSwitch</text>
  <text class="sub" x="600" y="149">scale-up fabric</text>

  <rect class="box" x="724" y="92" width="112" height="76"/>
  <text class="label" x="780" y="122">peer GPUs</text>
  <text class="sub" x="780" y="149">节点内</text>

  <path class="flow" d="M404 188 C452 188 454 130 502 130"/>
  <path class="flow" d="M690 130 H716"/>

  <rect class="box" x="470" y="254" width="112" height="76"/>
  <text class="label" x="526" y="284">PCIe</text>
  <text class="sub" x="526" y="311">host I/O</text>

  <rect class="box" x="616" y="254" width="112" height="76"/>
  <text class="label" x="672" y="284">HCA / NIC</text>
  <text class="sub" x="672" y="311">network I/O</text>

  <rect class="box" x="762" y="254" width="92" height="76"/>
  <text class="label" x="808" y="284">IB / RoCE</text>
  <text class="sub" x="808" y="311">scale-out</text>

  <path class="flow" d="M404 204 C438 204 434 292 462 292"/>
  <path class="flow" d="M582 292 H608"/>
  <path class="flow" d="M728 292 H754"/>
</svg>
