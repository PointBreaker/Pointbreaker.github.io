<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc">
  <title id="title">Assignment 4 数据处理流水线</title>
  <desc id="desc">从 WARC 和 HTML 开始，依次经过文本抽取、安全隐私过滤、质量过滤、去重、分词以及训练评估。每个阶段都输出统计和抽查样本。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6b4f"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#20382d" flood-opacity="0.12"/>
    </filter>
    <style>
      .box { fill: #ffffff; stroke: #a8c0b0; stroke-width: 1.5; rx: 14; filter: url(#shadow); }
      .gate { fill: #eef8f1; stroke: #55a274; stroke-width: 1.8; rx: 14; filter: url(#shadow); }
      .title { fill: #173c2b; font: 700 17px system-ui, -apple-system, sans-serif; text-anchor: middle; }
      .sub { fill: #66766e; font: 12px system-ui, -apple-system, sans-serif; text-anchor: middle; }
      .label { fill: #2f6b4f; font: 700 12px system-ui, -apple-system, sans-serif; letter-spacing: .06em; text-anchor: middle; }
      .arrow { fill: none; stroke: #2f6b4f; stroke-width: 2.2; marker-end: url(#arrow); }
      .audit { fill: #fffaf0; stroke: #d6b96e; stroke-width: 1.5; rx: 13; }
      .audit-title { fill: #765c1d; font: 700 15px system-ui, -apple-system, sans-serif; text-anchor: middle; }
      .audit-sub { fill: #7d7359; font: 12px system-ui, -apple-system, sans-serif; text-anchor: middle; }
    </style>
  </defs>

  <text x="560" y="30" class="label">DOCUMENT LIFECYCLE</text>

  <rect x="28" y="70" width="130" height="96" class="box"/>
  <text x="93" y="106" class="title">WARC</text>
  <text x="93" y="128" class="sub">HTTP + HTML</text>
  <text x="93" y="147" class="sub">metadata / bytes</text>

  <rect x="188" y="70" width="140" height="96" class="gate"/>
  <text x="258" y="106" class="title">抽取正文</text>
  <text x="258" y="128" class="sub">decode / parse</text>
  <text x="258" y="147" class="sub">remove boilerplate</text>

  <rect x="358" y="70" width="150" height="96" class="gate"/>
  <text x="433" y="106" class="title">安全与隐私</text>
  <text x="433" y="128" class="sub">language / PII</text>
  <text x="433" y="147" class="sub">harmful content</text>

  <rect x="538" y="70" width="140" height="96" class="gate"/>
  <text x="608" y="106" class="title">质量过滤</text>
  <text x="608" y="128" class="sub">rules + classifier</text>
  <text x="608" y="147" class="sub">threshold policy</text>

  <rect x="708" y="70" width="140" height="96" class="gate"/>
  <text x="778" y="106" class="title">去重</text>
  <text x="778" y="128" class="sub">exact + MinHash</text>
  <text x="778" y="147" class="sub">LSH candidates</text>

  <rect x="878" y="70" width="110" height="96" class="gate"/>
  <text x="933" y="106" class="title">Tokenize</text>
  <text x="933" y="128" class="sub">document IDs</text>
  <text x="933" y="147" class="sub">token stream</text>

  <rect x="1018" y="70" width="76" height="96" class="box"/>
  <text x="1056" y="105" class="title">LM</text>
  <text x="1056" y="128" class="sub">train</text>
  <text x="1056" y="147" class="sub">evaluate</text>

  <path d="M158 118 H188" class="arrow"/>
  <path d="M328 118 H358" class="arrow"/>
  <path d="M508 118 H538" class="arrow"/>
  <path d="M678 118 H708" class="arrow"/>
  <path d="M848 118 H878" class="arrow"/>
  <path d="M988 118 H1018" class="arrow"/>

  <text x="560" y="220" class="label">EVERY GATE LEAVES EVIDENCE</text>

  <rect x="92" y="250" width="210" height="116" class="audit"/>
  <text x="197" y="286" class="audit-title">Counts</text>
  <text x="197" y="310" class="audit-sub">documents in / kept / dropped</text>
  <text x="197" y="332" class="audit-sub">errors + rejection reasons</text>

  <rect x="330" y="250" width="210" height="116" class="audit"/>
  <text x="435" y="286" class="audit-title">Samples</text>
  <text x="435" y="310" class="audit-sub">random kept / rejected examples</text>
  <text x="435" y="332" class="audit-sub">threshold-boundary inspection</text>

  <rect x="568" y="250" width="210" height="116" class="audit"/>
  <text x="673" y="286" class="audit-title">Identity</text>
  <text x="673" y="310" class="audit-sub">stable document IDs</text>
  <text x="673" y="332" class="audit-sub">source and stage provenance</text>

  <rect x="806" y="250" width="210" height="116" class="audit"/>
  <text x="911" y="286" class="audit-title">Downstream effect</text>
  <text x="911" y="310" class="audit-sub">tokens / distribution / diversity</text>
  <text x="911" y="332" class="audit-sub">controlled LM comparison</text>

  <path d="M258 166 V205 H197 V250" class="arrow"/>
  <path d="M433 166 V205 H435 V250" class="arrow"/>
  <path d="M778 166 V205 H673 V250" class="arrow"/>
  <path d="M1056 166 V205 H911 V250" class="arrow"/>

  <text x="560" y="414" class="sub">概念重绘：依据 CS336 Assignment 4 的 extraction、filtering、deduplication、tokenization 与 downstream evaluation 任务关系。</text>
</svg>
