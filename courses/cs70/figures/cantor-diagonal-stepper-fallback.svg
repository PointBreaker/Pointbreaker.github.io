<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Cantor 对角线翻转构造</title>
  <desc id="desc">四行无限二进制序列的有限前缀中，对角线数字被标记，翻转后形成与第 i 行在第 i 位不同的新序列。</desc>
  <rect width="800" height="420" rx="24" fill="#f8fafc"/>
  <text x="45" y="54" fill="#153d2f" font-size="25" font-family="sans-serif" font-weight="700">Cantor 对角线法：专门避开第 i 行</text>
  <g font-family="monospace" font-size="25" fill="#334155"><text x="75" y="120">s₁ = 0 1 0 0 …</text><text x="75" y="170">s₂ = 1 1 0 1 …</text><text x="75" y="220">s₃ = 0 1 1 0 …</text><text x="75" y="270">s₄ = 1 0 1 0 …</text></g>
  <g fill="#f59e0b" opacity=".28"><rect x="146" y="92" width="28" height="36" rx="6"/><rect x="177" y="142" width="28" height="36" rx="6"/><rect x="208" y="192" width="28" height="36" rx="6"/><rect x="239" y="242" width="28" height="36" rx="6"/></g>
  <path d="M315 188H454" stroke="#2d6a4f" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="478" y="116" width="270" height="145" rx="17" fill="#e7f4ec" stroke="#2d6a4f" stroke-width="2"/>
  <text x="613" y="159" text-anchor="middle" fill="#153d2f" font-size="18" font-family="sans-serif">翻转对角线 0,1,1,0,…</text><text x="613" y="211" text-anchor="middle" fill="#153d2f" font-size="27" font-family="monospace">t = 1 0 0 1 …</text><text x="613" y="243" text-anchor="middle" fill="#475569" font-size="16" font-family="sans-serif">tᵢ ≠ sᵢᵢ</text>
  <text x="400" y="348" text-anchor="middle" fill="#64748b" font-size="17" font-family="sans-serif">t 与每一行至少在一个位置不同，因此不在假设的完整清单中</text>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2d6a4f"/></marker></defs>
</svg>
