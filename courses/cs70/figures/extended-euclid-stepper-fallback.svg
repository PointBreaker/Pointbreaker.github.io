<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">扩展欧几里得算法静态推导</title>
  <desc id="desc">从 252 和 198 的连续除法得到最大公因数 18，再反向代入得到 18 等于 4 乘 252 减 5 乘 198。</desc>
  <rect width="800" height="420" rx="24" fill="#f8fafc"/>
  <text x="44" y="55" fill="#183b32" font-size="25" font-family="sans-serif" font-weight="700">扩展欧几里得：正向求余，反向还原</text>
  <g font-family="monospace" font-size="22" fill="#1f2937">
    <text x="74" y="120">252 = 1·198 + 54</text>
    <text x="74" y="168">198 = 3·54  + 36</text>
    <text x="74" y="216"> 54 = 1·36  + 18</text>
    <text x="74" y="264"> 36 = 2·18  + 0</text>
  </g>
  <path d="M430 112 C520 130 520 260 430 278" fill="none" stroke="#2d6a4f" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="478" y="128" width="270" height="156" rx="16" fill="#e7f4ec" stroke="#2d6a4f" stroke-width="2"/>
  <text x="613" y="169" text-anchor="middle" fill="#153d2f" font-size="18" font-family="sans-serif">最后非零余数</text>
  <text x="613" y="211" text-anchor="middle" fill="#153d2f" font-size="25" font-family="monospace">gcd = 18</text>
  <text x="613" y="254" text-anchor="middle" fill="#153d2f" font-size="20" font-family="monospace">18 = 4·252 − 5·198</text>
  <text x="400" y="365" text-anchor="middle" fill="#64748b" font-size="17" font-family="sans-serif">当 gcd(a,m)=1 时，a 的 Bézout 系数就是它模 m 的逆</text>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2d6a4f"/></marker></defs>
</svg>
