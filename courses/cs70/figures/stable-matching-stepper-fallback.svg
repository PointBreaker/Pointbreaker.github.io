<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Gale–Shapley 稳定匹配静态流程</title>
  <desc id="desc">申请者 A B C 经过两轮拒绝后分别匹配 X Y Z，并标出学校只保留更偏好申请者的不变量。</desc>
  <rect width="800" height="420" rx="24" fill="#f7faf7"/>
  <text x="48" y="58" fill="#153d2f" font-size="25" font-family="sans-serif" font-weight="700">Gale–Shapley：提议、暂留、拒绝</text>
  <g font-family="sans-serif" font-size="18" text-anchor="middle">
    <g fill="#e7f4ec" stroke="#2d6a4f" stroke-width="2"><circle cx="110" cy="130" r="30"/><circle cx="110" cy="220" r="30"/><circle cx="110" cy="310" r="30"/></g>
    <g fill="#153d2f"><text x="110" y="137">A</text><text x="110" y="227">B</text><text x="110" y="317">C</text></g>
    <g fill="#fff8e7" stroke="#c98519" stroke-width="2"><circle cx="690" cy="130" r="30"/><circle cx="690" cy="220" r="30"/><circle cx="690" cy="310" r="30"/></g>
    <g fill="#6b4307"><text x="690" y="137">X</text><text x="690" y="227">Y</text><text x="690" y="317">Z</text></g>
  </g>
  <g fill="none" stroke="#2d6a4f" stroke-width="4" marker-end="url(#arrow)"><path d="M145 130 H650"/><path d="M145 220 H650"/><path d="M145 310 H650"/></g>
  <path d="M145 310 C330 310 470 220 650 220" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="8 7"/>
  <text x="400" y="376" text-anchor="middle" fill="#475569" font-size="17" font-family="sans-serif">终态 A–X、B–Y、C–Z；虚线表示 C 曾被 Y 拒绝</text>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2d6a4f"/></marker></defs>
</svg>
