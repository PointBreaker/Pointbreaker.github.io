<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">RSA 教学参数加解密流程</title>
  <desc id="desc">使用 p 等于 5、q 等于 11、e 等于 3、d 等于 27，将消息 7 加密为 13，再解密回 7。</desc>
  <rect width="800" height="420" rx="24" fill="#f7faf7"/>
  <text x="48" y="55" fill="#153d2f" font-size="25" font-family="sans-serif" font-weight="700">RSA：密钥生成 → 加密 → 解密</text>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="42" y="115" width="205" height="170" rx="18" fill="#e7f4ec" stroke="#2d6a4f" stroke-width="2"/>
    <text x="145" y="151" fill="#153d2f" font-size="19" font-weight="700">密钥生成</text><text x="145" y="190" fill="#334155" font-size="17">p=5, q=11</text><text x="145" y="222" fill="#334155" font-size="17">N=55, φ(N)=40</text><text x="145" y="254" fill="#334155" font-size="17">e=3, d=27</text>
    <rect x="300" y="115" width="205" height="170" rx="18" fill="#fff8e7" stroke="#c98519" stroke-width="2"/>
    <text x="403" y="151" fill="#6b4307" font-size="19" font-weight="700">公开加密</text><text x="403" y="196" fill="#334155" font-size="21">m = 7</text><text x="403" y="236" fill="#334155" font-size="17">7³ mod 55</text><text x="403" y="269" fill="#334155" font-size="21">c = 13</text>
    <rect x="558" y="115" width="205" height="170" rx="18" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="661" y="151" fill="#3730a3" font-size="19" font-weight="700">私钥解密</text><text x="661" y="196" fill="#334155" font-size="21">c = 13</text><text x="661" y="236" fill="#334155" font-size="17">13²⁷ mod 55</text><text x="661" y="269" fill="#334155" font-size="21">m′ = 7</text>
  </g>
  <g stroke="#475569" stroke-width="3" marker-end="url(#arrow)"><path d="M252 200H292"/><path d="M510 200H550"/></g>
  <text x="400" y="355" text-anchor="middle" fill="#64748b" font-size="17" font-family="sans-serif">微型参数便于手算，但不具备实际安全性</text>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#475569"/></marker></defs>
</svg>
