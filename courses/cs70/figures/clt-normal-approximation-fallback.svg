<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">二项分布的正态近似静态曲线</title>
  <desc id="desc">n 为 80、p 为二分之一时，正态近似曲线以 40 为中心，标准差约为 4.47。</desc>
  <rect width="800" height="420" rx="24" fill="#f8fafc"/>
  <text x="48" y="55" fill="#153d2f" font-size="25" font-family="sans-serif" font-weight="700">Binomial(80, 0.5) 的正态近似</text>
  <line x1="80" y1="332" x2="748" y2="332" stroke="#64748b" stroke-width="2"/><line x1="80" y1="90" x2="80" y2="332" stroke="#64748b" stroke-width="2"/>
  <path d="M95 331 C240 330 300 318 342 248 C370 201 382 126 414 112 C446 126 458 201 486 248 C528 318 588 330 733 331" fill="none" stroke="#2d6a4f" stroke-width="5"/>
  <path d="M414 112V332" stroke="#c98519" stroke-width="3" stroke-dasharray="8 7"/>
  <g fill="#475569" font-family="sans-serif" font-size="16"><text x="72" y="358">0</text><text x="395" y="358">μ=40</text><text x="718" y="358">80</text><text x="92" y="104">密度</text></g>
  <text x="510" y="126" fill="#153d2f" font-size="17" font-family="sans-serif">σ=√20≈4.47</text>
  <text x="400" y="394" text-anchor="middle" fill="#64748b" font-size="16" font-family="sans-serif">交互版本可调整 n 与 p，比较中心 np 和宽度 √(np(1−p))</text>
</svg>
