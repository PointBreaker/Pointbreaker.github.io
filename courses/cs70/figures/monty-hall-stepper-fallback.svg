<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Monty Hall 三种等概率情形</title>
  <desc id="desc">固定初选一号门，奖品分别位于一二三号门。坚持只赢第一种情形，换门赢第二和第三种情形。</desc>
  <rect width="800" height="420" rx="24" fill="#f7faf7"/>
  <text x="48" y="55" fill="#153d2f" font-size="25" font-family="sans-serif" font-weight="700">Monty Hall：枚举奖品初始位置</text>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="48" y="104" width="218" height="190" rx="18" fill="#fff8e7" stroke="#c98519" stroke-width="2"/><text x="157" y="143" fill="#6b4307" font-size="19" font-weight="700">奖品在门 1</text><text x="157" y="185" fill="#334155" font-size="17">初选正确</text><text x="157" y="224" fill="#166534" font-size="20">坚持赢</text><text x="157" y="260" fill="#991b1b" font-size="18">换门输</text>
    <rect x="291" y="104" width="218" height="190" rx="18" fill="#e7f4ec" stroke="#2d6a4f" stroke-width="2"/><text x="400" y="143" fill="#153d2f" font-size="19" font-weight="700">奖品在门 2</text><text x="400" y="185" fill="#334155" font-size="17">初选错误</text><text x="400" y="224" fill="#991b1b" font-size="18">坚持输</text><text x="400" y="260" fill="#166534" font-size="20">换门赢</text>
    <rect x="534" y="104" width="218" height="190" rx="18" fill="#e7f4ec" stroke="#2d6a4f" stroke-width="2"/><text x="643" y="143" fill="#153d2f" font-size="19" font-weight="700">奖品在门 3</text><text x="643" y="185" fill="#334155" font-size="17">初选错误</text><text x="643" y="224" fill="#991b1b" font-size="18">坚持输</text><text x="643" y="260" fill="#166534" font-size="20">换门赢</text>
  </g>
  <text x="400" y="350" text-anchor="middle" fill="#153d2f" font-size="21" font-family="sans-serif" font-weight="700">换门赢 2/3；坚持赢 1/3</text>
</svg>
