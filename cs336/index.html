<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS336 课程仪表盘</title>
  <style>
    :root {
      --bg: #f7f4ed;
      --paper: #fffdf8;
      --ink: #20231f;
      --muted: #62675f;
      --line: #d8d4ca;
      --accent: #166534;
      --accent-soft: #dcfce7;
      --accent-dark: #14532d;
      --warn: #8a4b08;
      --warn-soft: #fff4d6;
      --blue: #1e40af;
      --blue-soft: #dbeafe;
      --purple: #6b21a8;
      --purple-soft: #f3e8ff;
      --shadow: 0 18px 50px rgba(47, 52, 43, 0.09);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, -apple-system, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(22, 101, 52, 0.07), transparent 30rem),
        radial-gradient(circle at 90% 100%, rgba(30, 64, 175, 0.04), transparent 25rem),
        var(--bg);
      font-size: 15px;
      line-height: 1.6;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    /* ===== HEADER ===== */
    header {
      text-align: center;
      margin-bottom: 40px;
      position: relative;
    }

    header::after {
      content: '';
      display: block;
      width: 60px;
      height: 3px;
      background: var(--accent);
      margin: 18px auto 0;
      border-radius: 2px;
    }

    header h1 {
      font-family: ui-serif, Georgia, serif;
      font-size: 2.6rem;
      font-weight: 650;
      margin: 0 0 10px;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, var(--ink) 0%, var(--accent-dark) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      color: var(--muted);
      margin: 0;
      font-size: 0.95rem;
    }

    /* ===== PROGRESS ===== */
    .progress-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px 28px;
      box-shadow: var(--shadow);
      margin-bottom: 36px;
    }

    .progress-bar .track {
      flex: 1;
      height: 10px;
      background: var(--line);
      border-radius: 5px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar .fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #22c55e);
      border-radius: 5px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .progress-bar .fill::after {
      content: '';
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 20px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3));
      border-radius: 0 5px 5px 0;
    }

    .progress-bar .label {
      font-weight: 700;
      font-size: 0.92rem;
      white-space: nowrap;
      color: var(--accent-dark);
    }

    /* ===== FLOW GROUP ===== */
    .flow-group {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 24px 28px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
      transition: box-shadow 0.2s, transform 0.2s;
    }

    .flow-group:hover {
      box-shadow: 0 24px 60px rgba(47, 52, 43, 0.12);
      transform: translateY(-1px);
    }

    .flow-row {
      display: flex;
      align-items: stretch;
      gap: 0;
    }

    /* Left: Lectures timeline */
    .flow-lectures {
      flex: 1;
      position: relative;
      padding-left: 32px;
    }

    .flow-lectures::before {
      content: '';
      position: absolute;
      left: 7px;
      top: 16px;
      bottom: 16px;
      width: 2px;
      background: linear-gradient(to bottom, var(--line), var(--accent-soft), var(--line));
      border-radius: 1px;
    }

    .flow-lec {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-radius: 8px;
      text-decoration: none;
      color: var(--ink);
      transition: background 0.15s, transform 0.15s;
    }

    .flow-lec:hover {
      background: var(--accent-soft);
      transform: translateX(3px);
    }

    .flow-lec .lec-dot {
      position: absolute;
      left: -29px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 3px solid var(--line);
      background: var(--bg);
      z-index: 1;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }

    .flow-lec.completed .lec-dot {
      border-color: var(--accent);
      background: var(--accent);
    }

    .flow-lec.current .lec-dot {
      border-color: var(--blue);
      background: var(--blue);
      box-shadow: 0 0 0 4px var(--blue-soft);
      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { box-shadow: 0 0 0 4px var(--blue-soft); }
      50% { box-shadow: 0 0 0 7px rgba(30, 64, 175, 0.15); }
    }

    .flow-lec .lec-num {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--accent);
      min-width 24px;
      letter-spacing: 0.04em;
    }

    .flow-lec .lec-title {
      font-weight: 600;
      font-size: 0.9rem;
      flex: 1;
    }

    .flow-lec .lec-meta {
      font-size: 0.72rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .flow-lec .lec-arrow {
      color: var(--accent);
      font-size: 0.85rem;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .flow-lec:hover .lec-arrow {
      opacity: 1;
    }

    /* Middle: Arrow connector */
    .flow-connector {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      flex-shrink: 0;
      min-width: 56px;
    }

    .flow-connector .connector-line {
      flex: 1;
      width: 2px;
      background: linear-gradient(to bottom, transparent, var(--accent), transparent);
      opacity: 0.4;
    }

    .flow-connector .connector-arrow {
      font-size: 1.8rem;
      color: var(--accent);
      font-weight: bold;
      margin: 2px 0;
      opacity: 0.7;
    }

    .flow-connector .connector-top,
    .flow-connector .connector-bottom {
      width: 2px;
      height: 16px;
      background: var(--line);
      opacity: 0.5;
    }

    /* Right: Assignment card */
    .flow-assign {
      width: 260px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 18px 18px 18px 24px;
      border-radius: 12px;
      text-decoration: none;
      color: var(--ink);
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
      background: var(--bg);
      border: 1px solid var(--line);
    }

    .flow-assign:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.1);
    }

    .flow-assign::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 5px;
      border-radius: 12px 0 0 12px;
    }

    .flow-assign.ass1::before { background: var(--accent); box-shadow: 2px 0 10px rgba(22, 101, 52, 0.35); }
    .flow-assign.ass2::before { background: var(--blue); box-shadow: 2px 0 10px rgba(30, 64, 175, 0.35); }
    .flow-assign.ass3::before { background: var(--purple); box-shadow: 2px 0 10px rgba(107, 33, 168, 0.35); }
    .flow-assign.ass4::before { background: var(--warn); box-shadow: 2px 0 10px rgba(138, 75, 8, 0.35); }
    .flow-assign.ass5::before { background: #dc2626; box-shadow: 2px 0 10px rgba(220, 38, 38, 0.35); }

    .flow-assign .assign-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .flow-assign .assign-num {
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    .flow-assign .assign-badge {
      font-size: 0.62rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      letter-spacing: 0.03em;
    }

    .flow-assign.ass1 .assign-badge { background: var(--accent-soft); color: var(--accent-dark); }
    .flow-assign.ass2 .assign-badge { background: var(--blue-soft); color: var(--blue); }
    .flow-assign.ass3 .assign-badge { background: var(--purple-soft); color: var(--purple); }
    .flow-assign.ass4 .assign-badge { background: var(--warn-soft); color: var(--warn); }
    .flow-assign.ass5 .assign-badge { background: #fee2e2; color: #dc2626; }

    .flow-assign .assign-title {
      font-family: ui-serif, Georgia, serif;
      font-size: 1.05rem;
      font-weight: 600;
      margin: 0 0 4px;
    }

    .flow-assign .assign-desc {
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.45;
      margin-bottom: 10px;
    }

    .flow-assign .assign-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.73rem;
      padding-top: 8px;
      border-top: 1px dashed var(--line);
    }

    .flow-assign .assign-due {
      color: var(--warn);
      font-weight: 600;
    }

    .flow-assign .go-arrow {
      color: var(--accent);
      font-weight: 700;
      font-size: 0.85rem;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .flow-assign:hover .go-arrow {
      opacity: 1;
    }

    /* ===== LEGEND ===== */
    .legend {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid var(--line);
    }

    .legend-dot.completed { border-color: var(--accent); background: var(--accent); }
    .legend-dot.current { border-color: var(--blue); background: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
    .legend-dot.upcoming { background: var(--bg); }

    /* ===== FOOTER ===== */
    footer {
      margin-top: 64px;
      text-align: center;
      color: var(--muted);
      font-size: 0.82rem;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }

    footer a { color: var(--accent); }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 780px) {
      .flow-row { flex-direction: column; }
      .flow-connector {
        flex-direction: row;
        padding: 8px 0;
        min-width: auto;
      }
      .flow-connector .connector-line {
        width: auto;
        flex: 1;
        height: 2px;
        background: linear-gradient(to right, transparent, var(--accent), transparent);
      }
      .flow-connector .connector-top,
      .flow-connector .connector-bottom {
        width: 16px;
        height: 2px;
      }
      .flow-connector .connector-arrow {
        transform: rotate(90deg);
      }
      .flow-assign { width: 100%; }
    }

    @media (max-width: 640px) {
      header h1 { font-size: 1.7rem; }
      .container { padding: 24px 16px; }
      .flow-group { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>CS336: Language Modeling from Scratch</h1>
      <p>Stanford University · Percy Liang & Tatsu Hashimoto</p>
    </header>

    <!-- Progress -->
    <div class="progress-bar">
      <span class="label" id="progress-label">加载中...</span>
      <div class="track">
        <div class="fill" id="progress-fill" style="width: 0%"></div>
      </div>
    </div>

    <!-- Legend -->
    <div class="legend">
      <div class="legend-item"><div class="legend-dot completed"></div> 已完成</div>
      <div class="legend-item"><div class="legend-dot current"></div> 进行中</div>
      <div class="legend-item"><div class="legend-dot upcoming"></div> 未开始</div>
      <div class="legend-item">} 完成后可做</div>
    </div>

    <!-- Flow groups -->
    <div id="flow-container"></div>

    <footer>
      <p>教学改编 · 原始课程材料：<a href="https://cs336.stanford.edu/lectures/?trace=lecture_01" target="_blank">cs336.stanford.edu</a></p>
    </footer>
  </div>

  <script>
    async function loadDashboard() {
      const res = await fetch('api/status.json?v=2');
      const data = await res.json();

      // Progress
      const completedCount = data.lectures.filter(l => l.status === 'completed').length;
      const pct = (completedCount / data.totalLectures * 100).toFixed(0);
      document.getElementById('progress-fill').style.width = pct + '%';
      document.getElementById('progress-label').textContent =
        completedCount + ' / ' + data.totalLectures + ' 课已完成';

      // Build flow groups: one per assignment
      const container = document.getElementById('flow-container');
      let currentLecFound = false;

      data.assignments.forEach(asgn => {
        const group = document.createElement('div');
        group.className = 'flow-group';

        const row = document.createElement('div');
        row.className = 'flow-row';

        // Left: Lectures timeline
        const lecturesCol = document.createElement('div');
        lecturesCol.className = 'flow-lectures';

        asgn.dependsOn.forEach(lecNum => {
          const lec = data.lectures.find(l => l.number === lecNum);
          if (!lec) return;

          let status = lec.status;
          if (status === 'upcoming' && !currentLecFound) {
            status = 'current';
            currentLecFound = true;
          }

          const lecLink = document.createElement('a');
          lecLink.className = 'flow-lec ' + status;
          lecLink.href = lec.lessonFile || '#lec-' + lecNum;

          lecLink.innerHTML =
            '<div class="lec-dot"></div>' +
            '<span class="lec-num">L' + lecNum + '</span>' +
            '<span class="lec-title">' + lec.title + '</span>' +
            '<span class="lec-meta">' + lec.date + '</span>' +
            '<span class="lec-arrow">→</span>';
          lecturesCol.appendChild(lecLink);
        });

        row.appendChild(lecturesCol);

        // Middle: Connector arrow
        const connector = document.createElement('div');
        connector.className = 'flow-connector';
        connector.innerHTML =
          '<div class="connector-top"></div>' +
          '<div class="connector-line"></div>' +
          '<div class="connector-arrow">}</div>' +
          '<div class="connector-line"></div>' +
          '<div class="connector-bottom"></div>';
        row.appendChild(connector);

        // Right: Assignment card
        const assignCard = document.createElement('a');
        assignCard.className = 'flow-assign ass' + asgn.number;
        assignCard.href = asgn.assGuideFile || '#';

        assignCard.innerHTML =
          '<div class="assign-header">' +
            '<span class="assign-num">Assignment ' + asgn.number + '</span>' +
            '<span class="assign-badge">' + (asgn.assGuideFile ? '导读已就绪' : '导读制作中') + '</span>' +
          '</div>' +
          '<div class="assign-title">' + asgn.title + '</div>' +
          '<div class="assign-desc">' + asgn.description + '</div>' +
          '<div class="assign-footer">' +
            '<span class="assign-due">⏰ ' + asgn.due + '</span>' +
            '<span class="go-arrow">打开导读 →</span>' +
          '</div>';
        row.appendChild(assignCard);

        group.appendChild(row);
        container.appendChild(group);
      });
    }

    loadDashboard();
  </script>
</body>
</html>
