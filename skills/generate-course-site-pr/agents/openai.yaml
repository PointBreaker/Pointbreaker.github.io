interface:
  display_name: "Build CourseStack from a Link"
  short_description: "Turn one official course URL into a deep self-study course"
  default_prompt: "Use $generate-course-site-pr on this official course URL: audit current first-party sources, detect the course type, build and human-review a small Gold Standard lesson slice, then scale the approved teaching pattern, run depth/reading/render QA, and prepare a reviewable PR unless I explicitly request publication."
